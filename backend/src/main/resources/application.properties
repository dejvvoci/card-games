# Render/Railway caktojnë portin dinamikisht përmes env var PORT
server.port=${PORT:8080}

# Lejo origins nga frontend-i i deployuar (zëvendëso me URL-në reale pas deploy)
app.allowed-origins=${ALLOWED_ORIGINS:*}

# ---- Baza e të dhënave (PostgreSQL) — llogaritë e përdoruesve dhe historiku i statistikave ----
# Në lokal: DB "card_games" + rol "card_games_app" (krijuar një herë nga admini i Postgres-it).
# Në prodhim: Supabase (shih render.yaml — DB_HOST/DB_PORT/... vendosen manualisht te Render Environment).
# sslmode=prefer: përdor TLS kur ofrohet (Supabase e kërkon), bie mbrapa te lidhje pa TLS lokalisht.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:card_games}?sslmode=prefer
spring.datasource.username=${DB_USERNAME:card_games_app}
spring.datasource.password=${DB_PASSWORD:card_games_dev_pw}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
