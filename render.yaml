databases:
  # ---- Baza e të dhënave: llogaritë e përdoruesve + historiku i statistikave ----
  - name: pesekatesh-db
    plan: free

services:
  # ---- FRONTEND: Angular (Static Site) ----
  - type: web
    name: lojera-me-letra
    runtime: static
    rootDir: ./card-games-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/card-games-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---- BACKEND: Spring Boot (Docker) ----
  - type: web
    name: pesekatesh-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"   # rregulloje me URL-në e frontend-it (Render Static Site) pas deploy të parë
      - key: DB_HOST
        fromDatabase:
          name: pesekatesh-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pesekatesh-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pesekatesh-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pesekatesh-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pesekatesh-db
          property: password
