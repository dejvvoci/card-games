services:
  # ---- FRONTEND: Angular (Static Site) ----
  - type: web
    name: lojera-me-letra
    runtime: static
    rootDir: ./card-games-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/card-games-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---- BACKEND: Spring Boot (Docker) ----
  - type: web
    name: pesekatesh-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"   # rregulloje me URL-në e frontend-it (Render Static Site) pas deploy të parë
      # Baza e të dhënave tani është Supabase (jo Render Postgres — falas i Render-it skadon
      # përgjithmonë pas 30 ditësh). Vlerat e sakta vendosen manualisht te dashboard-i i Render
      # (Environment → këto çelësa), të marra nga Supabase → Project Settings → Database.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
